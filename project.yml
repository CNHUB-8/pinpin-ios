name: BeadStudio
schemes:
  BeadStudio:
    build:
      targets:
        BeadStudio: all
    test:
      targets: [BeadStudioTests]
options:
  bundleIdPrefix: local.personal
  deploymentTarget:
    iOS: "17.0"
targets:
  BeadStudio:
    type: application
    platform: iOS
    sources: [BeadStudio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.personal.BeadStudio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 拼豆工坊
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
  BeadStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BeadStudio

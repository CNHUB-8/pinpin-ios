name: Build unsigned iPhone IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Locate project
        shell: bash
        run: |
          if [ -f project.yml ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f pinpin-ios/project.yml ]; then
            echo "PROJECT_DIR=pinpin-ios" >> "$GITHUB_ENV"
          else
            echo "Missing project.yml" >&2
            exit 1
          fi
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ${{ env.PROJECT_DIR }}
        run: xcodegen generate
      - name: Run simulator tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcodebuild test -project BeadStudio.xcodeproj -scheme BeadStudio -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO
      - name: Compile for iPhone
        working-directory: ${{ env.PROJECT_DIR }}
        run: >-
          xcodebuild build -project BeadStudio.xcodeproj -scheme BeadStudio
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package unsigned IPA
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APP=build/DerivedData/Build/Products/Release-iphoneos/BeadStudio.app
          test -f "$APP/BeadStudio"
          xcrun lipo -verify_arch arm64 "$APP/BeadStudio"
          mkdir -p build/package/Payload
          ditto "$APP" build/package/Payload/BeadStudio.app
          cd build/package
          /usr/bin/zip -qry ../BeadStudio-unsigned.ipa Payload
          /usr/bin/unzip -t ../BeadStudio-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: BeadStudio-unsigned-IPA
          path: ${{ env.PROJECT_DIR }}/build/BeadStudio-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
